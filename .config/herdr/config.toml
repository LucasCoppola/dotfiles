onboarding = false

[theme]
name = "catppuccin"

[terminal]
default_shell = "zsh"
new_cwd = "follow"

[keys]
prefix = "ctrl+space"
settings = "prefix+shift+s"

workspace_picker = "prefix+s"
previous_workspace = "prefix+p"
next_workspace = "prefix+n"

# Use Vim movement inside the workspace picker instead of reaching for arrows.
navigate_workspace_up = "k"
navigate_workspace_down = "j"
detach = "prefix+d"
close_workspace = "prefix+shift+x"
close_tab = "prefix+shift+c"

reload_config = "prefix+shift+r"
edit_scrollback = "prefix+shift+e"
last_pane = "prefix+space"

new_tab = "prefix+c"
previous_tab = ""
next_tab = ""
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"
zoom = "prefix+m"
resize_mode = "prefix+shift+m"

# Shift movement resizes below instead of using Herdr's default pane swapping.
swap_pane_left = ""
swap_pane_down = ""
swap_pane_up = ""
swap_pane_right = ""

# Keep prefixed movement as a fallback for apps that need Ctrl-h/j/k/l.
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

[[keys.command]]
key = "prefix+q"
type = "shell"
command = "herdr-tab-switch 1"
description = "Switch to tab 1"

[[keys.command]]
key = "prefix+w"
type = "shell"
command = "herdr-tab-switch 2"
description = "Switch to tab 2"

[[keys.command]]
key = "prefix+e"
type = "shell"
command = "herdr-tab-switch 3"
description = "Switch to tab 3"

[[keys.command]]
key = "prefix+r"
type = "shell"
command = "herdr-tab-switch 4"
description = "Switch to tab 4"

[[keys.command]]
key = "prefix+t"
type = "shell"
command = "herdr-tab-switch 5"
description = "Switch to tab 5"

[[keys.command]]
key = "prefix+shift+h"
type = "shell"
command = "${HERDR_BIN_PATH:-herdr} pane resize --direction left --current"
description = "Resize pane left"

[[keys.command]]
key = "prefix+shift+j"
type = "shell"
command = "${HERDR_BIN_PATH:-herdr} pane resize --direction down --current"
description = "Resize pane down"

[[keys.command]]
key = "prefix+shift+k"
type = "shell"
command = "${HERDR_BIN_PATH:-herdr} pane resize --direction up --current"
description = "Resize pane up"

[[keys.command]]
key = "prefix+shift+l"
type = "shell"
command = "${HERDR_BIN_PATH:-herdr} pane resize --direction right --current"
description = "Resize pane right"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "Navigate left (Vim/Herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "Navigate down (Vim/Herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "Navigate up (Vim/Herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "Navigate right (Vim/Herdr)"

# Annotate selected terminal text and collect comments for Pi.
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "Annotate selected text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "Copy annotations as context"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "annotate.copy-archive"
description = "Copy and archive annotations"

[[keys.command]]
key = "prefix+ctrl+v"
type = "plugin_action"
command = "annotate.paste-archive"
description = "Paste annotations into Pi"

[[keys.command]]
key = "prefix+ctrl+s"
type = "plugin_action"
command = "annotate.send-archive"
description = "Send annotations to Pi"

[[keys.command]]
key = "prefix+alt+a"
type = "plugin_action"
command = "annotate.manage"
description = "Manage annotations"

# Review complete documents and Pi replies in the Full Annotate TUI.
[[keys.command]]
key = "prefix+alt+o"
type = "plugin_action"
command = "annotate.open"
description = "Review project documents"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "Review Pi's recent replies"

[[keys.command]]
key = "prefix+ctrl+o"
type = "plugin_action"
command = "annotate.last-newest"
description = "Review Pi's newest reply"

[ui]
accent = "#cba6f7"
copy_on_select = true
mouse_capture = true
confirm_close = false
prompt_new_tab_name = false

status_indicators = "symbols"
[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = true

[experimental]
kitty_graphics = true
