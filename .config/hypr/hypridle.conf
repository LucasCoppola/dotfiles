general {
    lock_cmd = true
    after_sleep_cmd = sleep 1 && hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # delay for resume, then turn on display.
    inhibit_sleep = 0                                      # disable wait for lock
}

listener {
    timeout = 600                                            # 10min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})' # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'   # screen on when activity is detected
    condition_cmd = ! pactl list sink-inputs | grep -q 'Corked: no' # do not blank while audio/video is playing
    condition_retry = 30
}

listener {
    timeout = 3600                                           # 1hr
    on-timeout = systemctl suspend                           # suspend system
    condition_cmd = ! pactl list sink-inputs | grep -q 'Corked: no' # do not suspend while audio/video is playing
    condition_retry = 30
}
